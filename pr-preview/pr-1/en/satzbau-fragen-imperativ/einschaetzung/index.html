<ul class="question-pairs">

<li><label><span>Arbeiten</span> <select name="frage-a4-0" data-item="0"><option value="">please choose</option><option value="0">Place 1</option><option value="1">Place 2</option><option value="2">Place 3</option><option value="3">Place 4</option></select></label></li>

</div></li>
