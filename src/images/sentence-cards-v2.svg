<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 212" role="img" aria-label="Satzkarten für Verb-Zweitstellung: Satz A Peter wohnt heute in Lindenberg, Satz B Heute wohnt Peter in Lindenberg">
  <rect width="340" height="212" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="14" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0f172a">A · Subjekt auf Position 1</text>

  <rect x="14" y="34" width="70" height="52" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="49" y="53" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#1e3a8a">POS. 1</text>
  <text x="49" y="74" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Peter</text>

  <rect x="90" y="34" width="84" height="52" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
  <text x="132" y="53" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#78350f">POS. 2 · VERB</text>
  <text x="132" y="74" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a">wohnt</text>

  <rect x="180" y="34" width="146" height="52" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="253" y="53" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#14532d">REST</text>
  <text x="253" y="74" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0f172a">heute in Lindenberg.</text>

  <text x="14" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0f172a">B · Zeit auf Position 1 (Verb bleibt auf 2!)</text>

  <rect x="14" y="122" width="64" height="52" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="46" y="141" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#14532d">POS. 1</text>
  <text x="46" y="162" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">Heute</text>

  <rect x="84" y="122" width="76" height="52" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
  <text x="122" y="141" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#78350f">POS. 2 · VERB</text>
  <text x="122" y="162" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">wohnt</text>

  <rect x="166" y="122" width="62" height="52" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="197" y="141" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#1e3a8a">SUBJEKT</text>
  <text x="197" y="162" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">Peter</text>

  <rect x="234" y="122" width="92" height="52" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="280" y="141" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#14532d">REST</text>
  <text x="280" y="162" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">in Lindenberg.</text>
</svg>
