  <text x="276" y="53" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#1e3a8a">SUBJEKT</text>
  <text x="276" y="74" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a">du?</text>

  <text x="14" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Ja-/Nein-Frage · Verb auf Position 1</text>

