  <text x="62" y="162" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Trinkst</text>

  <rect x="116" y="122" width="68" height="52" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="150" y="141" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#1e3a8a">SUBJEKT</text>
  <text x="150" y="162" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a">du</text>

  <rect x="190" y="122" width="136" height="52" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="258" y="141" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#14532d">REST</text>
  <text x="258" y="162" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">gern Kakao?</text>
