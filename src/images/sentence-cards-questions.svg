<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 212" role="img" aria-label="Satzkarten für Fragen: W-Frage Wie heißt du mit Verb auf Position 2, Ja-Nein-Frage Trinkst du gern Kakao mit Verb auf Position 1">
  <rect width="340" height="212" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="14" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0f172a">W-Frage · Verb auf Position 2</text>

