<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 186" role="img" aria-label="Position-0-Brücke ADUSO: Satz 1 Peter ist müde, Position 0 aber, danach Position 1 er, Position 2 lernt, Rest weiter">
  <rect width="340" height="186" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="14" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">Position 0 · ADUSO (aber, denn, und, sondern, oder)</text>

  <rect x="14" y="36" width="178" height="48" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="103" y="54" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#334155">SATZ 1</text>
  <text x="103" y="74" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">Peter ist müde,</text>

  <rect x="200" y="36" width="126" height="48" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
  <text x="263" y="54" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#14532d">POS. 0 · BRÜCKE</text>
  <text x="263" y="74" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a">aber</text>

  <rect x="14" y="98" width="80" height="52" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="54" y="117" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#1e3a8a">POS. 1</text>
  <text x="54" y="138" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a">er</text>

  <rect x="100" y="98" width="102" height="52" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
  <text x="151" y="117" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#78350f">POS. 2 · VERB</text>
  <text x="151" y="138" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a">lernt</text>

  <rect x="208" y="98" width="118" height="52" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="267" y="117" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#14532d">REST</text>
  <text x="267" y="138" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">weiter.</text>
</svg>
