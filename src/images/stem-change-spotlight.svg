<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 204" role="img" aria-label="Vokalwechsel im Präsens nur bei du und er, sie, es: helfen zu hilfst und hilft, sehen zu siehst und sieht, laufen zu läufst und läuft">
  <rect width="340" height="204" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="14" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">Vokalwechsel · nur bei du &amp; er/sie/es</text>

  <rect x="14" y="38" width="136" height="134" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="82" y="57" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#334155">Kein Wechsel</text>
  <line x1="24" y1="65" x2="140" y2="65" stroke="#cbd5e1" stroke-width="1"/>
  <text x="24" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#0f172a"><tspan font-weight="700">ich</tspan> helfe · laufe</text>
  <text x="24" y="109" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#0f172a"><tspan font-weight="700">wir</tspan> helfen · laufen</text>
  <text x="24" y="133" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#0f172a"><tspan font-weight="700">ihr</tspan> helft · lauft</text>
  <text x="24" y="157" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#0f172a"><tspan font-weight="700">sie/Sie</tspan> helfen</text>

  <rect x="160" y="38" width="166" height="134" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="243" y="57" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#78350f">du &amp; er / sie / es</text>
  <line x1="170" y1="65" x2="316" y2="65" stroke="#d97706" stroke-width="1"/>

  <text x="170" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#9f1239">e → i</text>
  <text x="214" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#0f172a">h<tspan font-weight="700" fill="#9f1239">i</tspan>lfst · h<tspan font-weight="700" fill="#9f1239">i</tspan>lft</text>

  <text x="170" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#1e3a8a">e → ie</text>
  <text x="214" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#0f172a">s<tspan font-weight="700" fill="#1e3a8a">ie</tspan>hst · s<tspan font-weight="700" fill="#1e3a8a">ie</tspan>ht</text>

  <text x="170" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#14532d">a → ä</text>
  <text x="214" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#0f172a">l<tspan font-weight="700" fill="#14532d">ä</tspan>ufst · l<tspan font-weight="700" fill="#14532d">ä</tspan>uft</text>
</svg>
