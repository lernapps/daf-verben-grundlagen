# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title:
  de: Verb-Zweitstellung im Hauptsatz
  en: Verb-Second Word Order
description:
  de: "Deutsche Aussagesätze mit dem konjugierten Verb auf Position 2 bauen — auch mit Zeit oder Ort auf Position 1 (Inversion)."
  en: "Build German statements with the conjugated verb in second position, including inversion after time or place."
competencies: [verb-zweitstellung]
blocks:
  - type: section
    id: einstieg
    title:
      de: Der feste Verb-Anker auf Position 2
      en: The Fixed Position-2 Verb Anchor
    blocks:
      - type: text
        text:
          de: "Peter plant seine Woche in Lindenberg. Im deutschen Aussagesatz gilt eine eiserne Regel: Das konjugierte Verb bleibt auf **Position 2** verankert — egal welche Satzkarte nach vorn rutscht."
          en: "Peter plans his week in Lindenberg. German statements follow one iron rule: the conjugated verb stays locked in **Position 2** — no matter which Sentence Card moves to the front."
      - type: figure
        image: images/sentence-cards-v2.svg
        source:
          de: Eigene Zeichnung
          en: Own drawing
        licence: CC0-1.0
        alt:
          de: "Satzkarten für Verb-Zweitstellung: Satz A zeigt Peter (Pos. 1), wohnt (Pos. 2 Verb), heute in Lindenberg (Rest). Satz B zeigt Heute (Pos. 1), wohnt (Pos. 2 Verb), Peter (Subjekt), in Lindenberg (Rest)."
          en: "Sentence Cards for verb-second order: Sentence A shows Peter (Pos. 1), wohnt (Pos. 2 Verb), heute in Lindenberg (Rest). Sentence B shows Heute (Pos. 1), wohnt (Pos. 2 Verb), Peter (Subject), in Lindenberg (Rest)."
        caption:
          de: "Wenn Zeit oder Ort auf Position 1 wandern, rutscht das Subjekt direkt hinter den Verb-Anker."
          en: "When time or place moves to Position 1, the subject slides directly behind the Verb Anchor."
      - type: single-choice
        id: v2-einstieg
        text:
          de: "Welcher Satz ist im Deutschen richtig, wenn *Am Montag* auf Position 1 steht?"
          en: "Which German sentence is correct when *Am Montag* (On Monday) sits in Position 1?"
        options:
          - text:
              de: "Am Montag lernt Peter Deutsch."
              en: "Am Montag lernt Peter Deutsch."
            correct: true
            info:
              de: "Richtig: Am Montag ist eine Satzkarte (Position 1), lernt bleibt auf Position 2, Peter folgt direkt dahinter."
              en: "Correct: Am Montag is one Sentence Card (Position 1), lernt stays in Position 2, and Peter follows right after."
          - text:
              de: "Am Montag Peter lernt Deutsch."
              en: "Am Montag Peter lernt Deutsch."
            correct: false
            info:
              de: "Das wäre englische Wortstellung — im Deutschen stünde lernt hier falsch auf Position 3."
              en: "That follows English word order — in German it pushes lernt into Position 3, which is wrong."
          - text:
              de: "Am Montag Deutsch lernt Peter."
              en: "Am Montag Deutsch lernt Peter."
            correct: false
            info:
              de: "Vor dem Verb darf nur eine einzige Satzkarte stehen, nicht zwei (Am Montag + Deutsch)."
              en: "Only one Sentence Card may stand before the verb, not two (Am Montag + Deutsch)."
        explanation:
          de: "Position 1 ist ein Satzglied (z. B. ein Wort wie Heute oder eine Gruppe wie Am Montag). Danach kommt immer sofort das konjugierte Verb."
          en: "Position 1 holds one whole phrase (e.g. Heute or Am Montag). The conjugated verb always comes immediately next."
  - type: section
    id: regel
    title:
      de: Was passiert, wenn etwas anderes vorn steht?
      en: What Happens When Something Else Goes First?
    blocks:
      - type: definition
        term:
          de: Verb-Zweitstellung (V2)
          en: Verb-second order (V2)
        explanation:
          de: "In jedem deutschen Aussagesatz steht das konjugierte Verb auf Position 2. Wandert eine Zeit- oder Ortskarte nach vorn auf Position 1, springt das Subjekt direkt hinter das Verb."
          en: "In every German statement, the conjugated verb stands in Position 2. If a time or place card moves to Position 1, the subject jumps right behind the verb."
      - type: table
        caption:
          de: "Position 1 tauschen — Position 2 bleibt fest"
          en: "Swap Position 1 — Position 2 stays locked"
        header:
          - de: Position 1
            en: Position 1
          - de: Position 2 (Verb)
            en: Position 2 (Verb)
          - de: Rest des Satzes
            en: Rest of sentence
        rows:
          - - de: Mina
              en: Mina
            - de: "**spielt**"
              en: "**spielt**"
            - de: heute im Sportverein.
              en: heute im Sportverein.
          - - de: Heute
              en: Heute
            - de: "**spielt**"
              en: "**spielt**"
            - de: Mina im Sportverein.
              en: Mina im Sportverein.
          - - de: Im Sportverein
              en: Im Sportverein
            - de: "**spielt**"
              en: "**spielt**"
            - de: Mina heute.
              en: Mina heute.
  - type: section
    id: uebung
    title:
      de: Übung
      en: Practice
    blocks:
      - type: multiple-choice
        id: v2-pruefen
        text:
          de: "Prüfe die Satzkarten: In welchen Sätzen steht das konjugierte Verb richtig auf Position 2?"
          en: "Check the Sentence Cards: in which sentences is the conjugated verb properly in Position 2?"
        options:
          - text:
              de: "Am Dienstag spielt Lukas Fußball im Park."
              en: "Am Dienstag spielt Lukas Fußball im Park."
            correct: true
            info:
              de: "Richtig: Am Dienstag (Pos. 1) + spielt (Pos. 2) + Lukas (Subjekt)."
              en: "Correct: Am Dienstag (Pos. 1) + spielt (Pos. 2) + Lukas (subject)."
          - text:
              de: "Nach der Schule Peter fährt mit dem Fahrrad."
              en: "Nach der Schule Peter fährt mit dem Fahrrad."
            correct: false
            info:
              de: "Falsch: Hier steht fährt auf Position 3. Richtig: Nach der Schule fährt Peter mit dem Fahrrad."
              en: "Incorrect: fährt is pushed to Position 3. Correct: Nach der Schule fährt Peter mit dem Fahrrad."
          - text:
              de: "Im Park treffen wir Nadia und Mina."
              en: "Im Park treffen wir Nadia und Mina."
            correct: true
            info:
              de: "Richtig: Im Park (Pos. 1) + treffen (Pos. 2) + wir (Subjekt)."
              en: "Correct: Im Park (Pos. 1) + treffen (Pos. 2) + wir (subject)."
        explanation:
          de: "Zähle immer die Satzkarten: Egal wie viele Wörter auf Position 1 stehen (z. B. Nach der Schule), danach kommt sofort das Verb."
          en: "Always count Sentence Cards: no matter how many words fill Position 1 (e.g. Nach der Schule), the verb comes immediately next."
      - type: ordering
        id: v2-ordnen
        text:
          de: "Bringe die Satzkarten in die richtige Reihenfolge. Beginne mit der Zeitangabe *Am Wochenende*."
          en: "Put the Sentence Cards in the right order. Start with the time phrase *Am Wochenende*."
        items:
          - de: Am Wochenende
            en: Am Wochenende
          - de: fährt
            en: fährt
          - de: Familie Weber
            en: Familie Weber
          - de: an den See.
            en: an den See.
        explanation:
          de: "Am Wochenende (Pos. 1) + fährt (Pos. 2) + Familie Weber (Subjekt) + an den See (Rest)."
          en: "Am Wochenende (Pos. 1) + fährt (Pos. 2) + Familie Weber (subject) + an den See (rest)."
      - type: language-task
        id: v2-umstellen
        languages: { source: en, target: de }
        mode: write
        form: { punctuation: ok }
        task:
          de: Schreibe jeden Satz so um, dass das angegebene Wort auf Position 1 steht. Achte auf Position 2!
          en: Rewrite each sentence starting with the given phrase in Position 1. Keep the verb in Position 2!
        items:
          - source: "Peter reads a book today. → Start with: Heute"
            target: "Heute liest Peter ein Buch."
            mistakes:
              - answer: "Heute Peter liest ein Buch."
                message:
                  de: "Achtung: Das Verb liest muss auf Position 2 bleiben — Peter kommt direkt dahinter."
                  en: "Watch out: The verb liest must stay in Position 2 — Peter goes right after it."
          - source: "We eat rolls in Lindenberg. → Start with: In Lindenberg"
            target: "In Lindenberg essen wir Brötchen."
            mistakes:
              - answer: "In Lindenberg wir essen Brötchen."
                message:
                  de: "In Lindenberg ist Position 1, deshalb kommt essen sofort auf Position 2."
                  en: "In Lindenberg fills Position 1, so essen comes immediately in Position 2."
        explanation:
          de: "Nach jeder Zeit- oder Ortsangabe am Satzanfang kommt im Deutschen sofort der Verb-Anker, nie das Subjekt."
          en: "After any time or place phrase at the start of a German sentence, the Verb Anchor comes immediately, never the subject."
